<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mentayasandbox — lab eksplorasi</title><meta name="description" content="Eksperimen website dan desain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--fg:#d6e2f0;--mute:#6f8196;--card:#131a24;--line:#243246;--acc:#4da3ff;--ide:#c792ea;--jalan:#ffcb6b;--selesai:#7ee787;--mono:'JetBrains Mono',ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:light){:root{--bg:#eef3f9;--fg:#14202e;--mute:#5d7188;--card:#fff;--line:#bccbdc;--acc:#0b63c9;--ide:#8a3fc0;--jalan:#9a6a00;--selesai:#1a7f37}}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:14px/1.6 var(--mono);background-color:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header{background:var(--bg);border-bottom:1px solid var(--line)}header .wrap{display:flex;justify-content:space-between;align-items:center;height:52px}
.logo{font-weight:700}.logo b{color:var(--acc)}.logo:before{content:'> ';color:var(--acc)}
.v{color:var(--mute);font-size:12px}
.hero{padding:52px 0 24px}.hero small{color:var(--acc)}
h1{font:700 clamp(26px,5.5vw,44px)/1.15 var(--mono);margin:8px 0 12px;max-width:18em;background:var(--bg);display:inline}
.lead{color:var(--mute);max-width:40em;background:var(--bg);display:inline-block;margin:14px 0 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.bar button{font:600 12px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:5px 12px;cursor:pointer}
.bar button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.col{background:var(--bg);border:1px solid var(--line)}
.col>h2{margin:0;padding:10px 14px;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.col>h2 i{font-style:normal;color:var(--mute)}
.c{display:block;color:inherit;text-decoration:none;margin:12px;border:1px solid var(--line);background:var(--card);border-left:3px solid var(--k)}
.c .im{height:90px;background-size:cover;background-position:center;border-bottom:1px solid var(--line)}
.c .in{padding:10px 12px 12px}.c h3{margin:0;font:700 15px var(--mono)}.c p{margin:4px 0 8px;color:var(--mute);font-size:13px}
.t{font-size:11px;border:1px solid var(--line);padding:1px 7px;color:var(--mute)}
.empty{margin:12px;color:var(--mute);font-size:12px}
footer{margin-top:48px;border-top:1px solid var(--line);background:var(--bg);padding:22px 0 36px;color:var(--mute);font-size:12px}footer a{color:var(--acc)}
</style></head><body>
<header><div class="wrap"><div class="logo">mentaya<b>.</b>sandbox</div><div class="v">lab / v0.1</div></div></header>
<main class="wrap"><section class="hero"><small>// ruang eksplorasi</small><br><h1>Tempat mencoba hal-hal yang belum tentu jadi.</h1><br>
<p class="lead">Eksperimen website dan desain: setengah jadi, gagal, atau sedang jalan. Karya final ada di portofolio.</p></section>
<div class="bar" id="bar"></div><div class="cols" id="cols"></div></main>
<footer><div class="wrap">eksperimen &amp; coretan · karya matang → <a href="https://cahyadies.github.io">cahyadies ↗</a></div></footer>
<script>
const $=s=>document.querySelector(s);let f='semua';
const X=[ // GANTI. t: web/desain, s: ide/jalan/selesai, link & img opsional
{n:'Dashboard driver shuttle',t:'web',s:'jalan',d:'Eksplor tampilan dashboard sederhana untuk driver.',link:'',img:''},
{n:'Sistem warna hangat',t:'desain',s:'selesai',d:'Uji palet warna untuk usaha rumahan.',link:'',img:''},
{n:'Layout katalog tanpa keranjang',t:'web',s:'ide',d:'Katalog ringan yang cepat di HP.',link:'',img:''}];
function draw(){
$('#bar').innerHTML=['semua','web','desain'].map(k=>`<button class="${f===k?'on':''}" data-k="${k}">${k}</button>`).join('');
$('#cols').innerHTML=['ide','jalan','selesai'].map(s=>{const L=X.filter(x=>x.s===s&&(f==='semua'||x.t===f));
return `<div class="col" style="--k:var(--${s})"><h2><span style="color:var(--${s})">● ${s}</span><i>${L.length}</i></h2>${L.map(x=>`<${x.link?`a href="${x.link}" target="_blank" rel="noopener"`:'div'} class="c">${x.img?`<div class="im" style="background-image:url('${x.img}')"></div>`:''}<div class="in"><h3>${x.n}</h3><p>${x.d}</p><span class="t">${x.t}</span></div></${x.link?'a':'div'}>`).join('')||'<div class="empty">// kosong</div>'}</div>`}).join('');
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{f=b.dataset.k;draw()})}
draw();
</script></body></html>
